[package]
name = "irrigation-pro"
version = "0.1.0"
description = "Irrigation Pro — logiciel de dimensionnement et de suivi des projets d'irrigation"
authors = ["Irrigation Pro"]
edition = "2021"
rust-version = "1.77.2"
# Logiciel propriétaire : ni publication sur crates.io, ni licence ouverte.
publish = false

# La logique de démarrage vit dans la bibliothèque ; `main.rs` ne fait que
# l'appeler. C'est la structure recommandée par Tauri v2 : elle permet de
# réutiliser le même code si une cible mobile est ajoutée un jour.
[lib]
name = "irrigation_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Binaire de production : compact et sans symboles de débogage.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
